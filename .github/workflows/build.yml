name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test core behavior
        run: swift run HeartCoreChecks
      - name: Build local app
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotchHeart-macOS
          path: dist/*.zip
